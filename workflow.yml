# .claude/workflow.yml — how build, judge and implement-ticket work in this project.
# A key left out takes its default.

models:
  builder: sonnet
  judge: opus
  recheck: sonnet             # the short recheck after an evidence-only judge round

review:
  evidence: script            # script | judge — check-evidence.mjs first, or the judge alone
  evidence_findings: recheck  # recheck | full-round — what follows a judge round whose findings are all evidence
  # speed keys (context, step gate, prove failing first, per-ticket extras) live in Conventions, not here
  reuse_suite_run: true       # with `test scope: full` only: the judge accepts a recorded whole-suite run for the same commit

parallel:
  tickets: 1                  # >1 only with a Conventions `isolated test run` line
  e2e_workers: 1              # >1 needs per-worker databases and ports

validation:                   # tunes the validation report the builder writes
  report: true                  # false: no rendered report (HTML/PDF); the evidence, report.json and screenshots, is still kept
  report_scope: ticket          # ticket | item — a rendered report for every ticket, or one for the whole item after its last ticket
  report_pdf: false             # true: also write a PDF of each rendered report
  video_walkthrough: false      # true: record the key flow as a video with chapters, embedded in the report
  video_scope: ticket           # ticket | item | app — a video of each ticket's flow, of the item's flow after its last ticket, or of the whole app after it
  video_commit: true            # false: keep videos git-ignored instead of committed
  video_max_mb: 10              # a larger video is re-encoded or shortened; check-evidence refuses it if still over
  before_after: false           # true: also capture the walkthrough screens on the base branch, shown side by side
  traces: true                  # link failed and retried tests to their Playwright trace; mark flaky tests
  changed_line_coverage: false  # true: a tile with test coverage of only this ticket's changed lines; needs the project's coverage tool
